[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eviground"
version = "0.1.0"
description = "EviGround: evidence-grounded, hallucination-aware detection and localization of AI-generated and AI-edited images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "omegaconf>=2.3",
    "pyarrow>=14",          # SID-Set parquet shards (data layer)
    "huggingface_hub>=0.24", # DiffSeg30k / SID-Set downloads (Colab only; imported lazily)
]

[project.optional-dependencies]
# Heavy runtime stack (installed in Colab; torch itself is preinstalled there).
train = [
    "torch>=2.3",
    "torchvision>=0.18",
    "open_clip_torch>=2.24",
    "timm>=1.0",
    "peft>=0.11",
    "transformers>=4.44",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "nbmake>=1.5",
    "ipykernel>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

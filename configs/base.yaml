# Shared settings. Paths are NOT set here: they come from eviground.env
# (Drive on Colab; override with EVIGROUND_DRIVE_ROOT / EVIGROUND_LOCAL_DATA).
project: eviground
seed: 42
seeds: [42, 123, 2026]        # the paper reports mean and std over these three
deterministic: true

compute:
  gpu_preference: L4
  cu_per_hour: 1.7            # read the live rate in Colab's resource panel and update
  precision: bf16             # fp16 + GradScaler on T4

data:
  profile: medium
  crop: 256                   # no padding, no resizing; test images are tiled (brief v1.2, D0)
  clip_size: 224
  balance: [1, 1, 1]          # real : fully generated : locally edited
  num_workers: 4

checkpoint:
  every_steps: 500            # optimizer steps between step_*.pt / last.pt
  keep_last: 2                # step files kept
  monitor: selection          # unified: mean(macro OvR AUC, per-image mask F1); detection: AUC
  mode: max

logging:
  level: INFO
  log_every_steps: 50

# M1-M4 (Research Specification section 8; Implementation Brief M1-M4)
model:
  d: 512
  clip_size: 224
  head_dropout: 0.1
  edit_threshold: 0.5         # fixed on validation data (test-time rule)
  semantic:
    backbone: openai/clip-vit-large-patch14   # transformers CLIPVisionModel, SDPA attention
    revision: 32bd64288804d66eefd0ccbe215aa642df71cc41   # pinned HF commit (resolved in notebook 05, 15 Nov)
    weights_sha256: a2bf730a0c7debf160f7a6b50b3aaf3703e7e88ac73de7a314903141db026dcb  # model.safetensors at that commit
    tiny: null                # debug: a small random CLIP config instead (no download)
    cache_dir: null           # set by notebook 05 to the local disk: Drive cannot hold HF's symlinks
    local_files_only: false
    lora: {rank: 8, alpha: 16, layers: [20, 21, 22, 23], targets: [q_proj, v_proj], dropout: 0.0}
  trace:
    name: efficientnet_b0
    pretrained: true
    channels_last: false      # switched on if CP2 timing shows it is faster
  fusion: {layers: 2, heads: 8, dropout: 0.1}

loss:
  lambda_seg: 1.0             # BCE on all samples + Dice on edited samples (15 Nov 2026)
  lambda_att: 0.1             # attention alignment on edited samples; 0 in the ablation
  label_smoothing: 0.05

optim:
  lr: 1.0e-4                  # fusion, heads, trace branch, semantic projection
  lr_lora: 5.0e-5             # first change to propose if CP3 flattens early: 1e-4
  weight_decay: 0.05


# Trainer (Milestone 3 plan, step 3)
train:
  profile: unified            # unified | detection
  epochs: 20
  crops_per_epoch: 24000      # 1 : 1 : 1 (unified); detection: real : generated = 1 : 1
  batch_size: 32
  grad_accum: 1
  warmup_epochs: 1            # linear warm-up, then cosine to 0
  grad_clip: 1.0
  patience: 4                 # epochs without a better selection score
  val_batch_size: 64
  detection: {epochs: 15, crops_per_epoch: 16000}
  overfit: {images: 64, steps: 300, target: 0.99, eval_every: 25}

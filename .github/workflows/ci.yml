name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]   # 3.13: what Colab runs (CP2, 15 Nov)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so the secret scan covers every commit

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (CPU only)
        run: |
          python -m pip install --upgrade pip
          # torch and torchvision from the same CPU index (a PyPI torchvision is a CUDA build)
          pip install --only-binary :all: torch==2.14.1 torchvision==0.29.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
          pip install --only-binary :all: timm==1.0.31 peft==0.21.3 transformers==5.20.2  # model tests (CPU, no weights)

      - name: Lint
        run: ruff check src tests

      - name: Tests
        run: pytest -q

      - name: Repository audit (secrets, data, checkpoints; full history)
        run: python -m eviground.utils.repo_audit --history

      - name: Notebook dry runs
        env:
          EVIGROUND_DRY_RUN: "1"
        run: pytest -q --nbmake notebooks/00_setup_and_data.ipynb notebooks/00c_data_download.ipynb notebooks/00b_data_probe.ipynb notebooks/01_cp1_data_integrity.ipynb notebooks/02_crop_diagnostic.ipynb notebooks/03_mask_diagnostic.ipynb notebooks/04_pack_shards.ipynb notebooks/05_cp2_model_build.ipynb

      - name: Notebook 06 dry runs (CP3, both profiles)
        env:
          EVIGROUND_DRY_RUN: "1"
        run: |
          EVIGROUND_PROFILE=unified pytest -q --nbmake notebooks/06_cp3_training.ipynb
          EVIGROUND_PROFILE=detection pytest -q --nbmake notebooks/06_cp3_training.ipynb

      - name: Notebook 07 dry run (CP4 preparation; 7z for the BR-Gen listing)
        env:
          EVIGROUND_DRY_RUN: "1"
        run: |
          command -v 7z || (sudo apt-get update -q && sudo apt-get install -y -q p7zip-full)
          pytest -q --nbmake notebooks/07_cp4_prep.ipynb

      - name: Notebook 08 and 09 dry runs (localization diagnosis, CP4 gate)
        env:
          EVIGROUND_DRY_RUN: "1"
        run: pytest -q --nbmake notebooks/08_localization_diagnosis.ipynb notebooks/09_cp4_gate.ipynb

      - name: Notebook 12 dry run (frozen evaluation subsets)
        env:
          EVIGROUND_DRY_RUN: "1"
        run: pytest -q --nbmake notebooks/12_eval_subsets.ipynb

      - name: Notebook 12b dry run (frozen P6 subsets; 7z for the BR-Gen files)
        env:
          EVIGROUND_DRY_RUN: "1"
        run: |
          command -v 7z || (sudo apt-get update -q && sudo apt-get install -y -q p7zip-full)
          pytest -q --nbmake notebooks/12b_p6_subsets.ipynb

      - name: Notebook 14 dry run (CP5 evidence faithfulness, P6 explanations; 7z for BR-Gen)
        env:
          EVIGROUND_DRY_RUN: "1"
        run: |
          command -v 7z || (sudo apt-get update -q && sudo apt-get install -y -q p7zip-full)
          pytest -q --nbmake notebooks/14_cp5_explanations.ipynb

      - name: Notebook 15 dry run (CP5 token-level deletion, P6 cache; 7z for BR-Gen)
        env:
          EVIGROUND_DRY_RUN: "1"
        run: |
          command -v 7z || (sudo apt-get update -q && sudo apt-get install -y -q p7zip-full)
          pytest -q --nbmake notebooks/15_cp5_token_deletion.ipynb

      - name: Notebook 16 dry run (Drive test-set tars, P5 freeze; 7z for BR-Gen)
        env:
          EVIGROUND_DRY_RUN: "1"
        run: |
          command -v 7z || (sudo apt-get update -q && sudo apt-get install -y -q p7zip-full)
          pytest -q --nbmake notebooks/16_test_cache.ipynb

      - name: Notebook 18 dry run (CP6 reports with MockLLM; no detector, no vLLM)
        env:
          EVIGROUND_DRY_RUN: "1"
        run: pytest -q --nbmake notebooks/18_cp6_reports.ipynb

      - name: Notebook 18b dry run (CP6 analysis on CPU; template fix, HR-GT split)
        env:
          EVIGROUND_DRY_RUN: "1"
        run: pytest -q --nbmake notebooks/18b_cp6_analysis.ipynb

      - name: Notebook 17 dry run (Phase C blocks under a CU cap; tiny models, fake tars)
        env:
          EVIGROUND_DRY_RUN: "1"
        run: pytest -q --nbmake notebooks/17_phase_c_evaluation.ipynb

      - name: Notebook 17b dry run (T4 fp16 vs L4 bf16 parity; fake references)
        env:
          EVIGROUND_DRY_RUN: "1"
        run: pytest -q --nbmake notebooks/17b_t4_parity.ipynb

      - name: Notebook 13 dry run (unified seeds 123 and 2026)
        env:
          EVIGROUND_DRY_RUN: "1"
        run: pytest -q --nbmake notebooks/13_unified_seeds.ipynb

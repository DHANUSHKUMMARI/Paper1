# CPU-only settings for tests, CI and smoke runs: tiny random backbones, synthetic data,
# no downloads of weights or datasets.
defaults: [base]
experiment: debug

compute:
  gpu_preference: cpu
  cu_per_hour: 0.0
  precision: fp32

data:
  profile: synthetic
  crop: 128
  num_workers: 0

model:
  d: 64
  semantic:
    pretrained: false         # a tiny random CLIP with the real code path (no download)
    tiny: {hidden_size: 64, intermediate_size: 128, num_hidden_layers: 4, num_attention_heads: 4}
    lora: {rank: 4, alpha: 8, layers: [2, 3], targets: [q_proj, v_proj], dropout: 0.0}
  trace: {name: efficientnet_b0, pretrained: false}
  fusion: {layers: 1, heads: 4, dropout: 0.1}

train:
  epochs: 2
  steps_per_epoch: 3
  batch_size: 4
